<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Заказы (Продавец)</title>
    <link rel="stylesheet" href="/seller/css/orders.css">
    <script src="/seller/js/orders.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Продавец</span></div>
            </div>
            <div class="nav-menu">
                <a href="/seller/products">Каталог</a>
                <a href="/seller/orders" class="active-nav">Заказы</a>
                <a href="/seller/purchases">Покупки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="orders-content">
        <h1 class="page-title">Заказы</h1>

        <div class="orders-filters">
            <a href="/seller/orders?status=ALL" th:class="'filter-chip' + ${currentStatus == 'ALL' ? ' active' : ''}">Все</a>
            <a href="/seller/orders?status=CREATED" th:class="'filter-chip' + ${currentStatus == 'CREATED' ? ' active' : ''}">Создан</a>
            <a href="/seller/orders?status=READY" th:class="'filter-chip' + ${currentStatus == 'READY' ? ' active' : ''}">Готов</a>
        </div>

        <div class="orders-list">

            <div class="order-card" th:each="order : ${orders}">
                <div class="order-header">
                    <div class="order-number" th:text="'Заказ № ' + ${order.id}"></div>
                    <div class="order-date" th:text="${#temporals.format(order.timestamp, 'dd MMMM yyyy, HH:mm')}"></div>
                    <div th:class="'order-status ' +${order.status == 'CREATED' ? 'status-created' : 'status-ready'}" th:text="${order.status == 'CREATED' ? 'Создан' : 'Готов'}"></div>
                </div>
                <div class="order-info">
                    <div class="order-client">
                        Клиент: <span class="client-name" th:text="${order.clientName}"></span><br>
                        Телефон: <span th:text="${order.clientPhone}"></span>
                    </div>
                    <div class="order-total" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></div>
                    <div class="order-actions">
                        <button class="btn-issue" 
                                th:data-order-id="${order.id}"
                                th:data-status="${order.status}"
                                th:text="${order.status == 'CREATED' ? 'Собрать заказ' : 'Выдать заказ'}">
                        </button>
                    </div>
                </div>
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Количество</th>
                            <th>Цена</th>
                            <th>Сумма</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${order.products}">
                            <td><a th:href="'/seller/orders/' + ${product.productId}" class="product-link" th:text="${product.productName}">Электрогитара Fender Stratocaster</a></td>
                            <td th:text="${product.quantity + ' шт.'}"></td>
                            <td th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></td>
                            <td th:text="${#numbers.formatDecimal(product.subtotal, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<div class="toast-message"></div>
</body>
</html>
