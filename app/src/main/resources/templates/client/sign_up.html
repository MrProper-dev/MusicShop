<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Регистрация</title>
    <link rel="stylesheet" href="/client/css/sign_up.css">
    <script src="/client/js/sign_up.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="brand">
            <div class="logo-emojy">🎸</div>
            <div class="store-title">MuseLand</div>
        </div>
    </div>

    <div class="register-content">
        <h1 class="page-title">Регистрация</h1>
        <p class="page-subtitle">Создайте аккаунт для покупок</p>

        <form class="register-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="fullname">ФИО</label>
                    <input type="text" id="fullname" name="fullName" placeholder="Иванов Иван Иванович" required>
                </div>
                <div class="form-group">
                    <label for="phone">Номер телефона</label>
                    <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Подтверждение пароля</label>
                <input type="password" id="confirm_password" name="confirmPassword" placeholder="Повторите пароль" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-register">Зарегистрироваться</button>
            </div>
        </form>

        <div class="login-link">Уже есть аккаунт?<a href="/login">Войти</a></div>
    </div>
</div>

<div class="toast-message"></div>
</body>
</html>
