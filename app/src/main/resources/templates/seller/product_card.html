<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Карточка товара (Продавец)</title>
    <link rel="stylesheet" href="/seller/css/product_card.css">
    <script src="/seller/js/product_card.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Продавец</span></div>
            </div>
            <div class="nav-menu">
                <a href="/seller/products">Каталог</a>
                <a href="/seller/orders">Заказы</a>
                <a href="/seller/purchases">Покупки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="breadcrumb-block">
        <a href="/seller/products">Каталог</a> <span>/</span> 
        <a th:href="'/seller/products?cat-id=' + ${product.category.id}" th:text="${product.category.name}"></a> <span>/</span> 
        <span style="color:#5f5b54; font-weight:500;" th:text="${product.name}"></span>
    </div>

    <div class="action-top">
        <button onclick="history.back()" class="btn-back-link">← Назад</button>
    </div>

    <div class="product-core">
        <div class="gallery-area">
            <div class="primary-image">
                <img class="cross-img" th:src="'/pictures/' + ${mainPicture.path}" th:alt="${product.name}">
            </div>
            <div class="thumb-row">
                <div th:each="img : ${product.pictures}" class="thumb-item">
                    <img class="thumb-img" th:src="'/pictures/' + ${img.path}">
                </div>
            </div>
        </div>

        <div class="info-area">
            <h1 class="product-headline" th:text="${product.name}"></h1>
            <div class="category-tag" th:text="'📁 ' + ${product.category.name}"></div>
            <div class="price-tag" th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></div>

            <div class="stock-row">
                <div th:if="${product.quantity} > 0" class="stock-badge">✓ В наличии</div>
                <div th:if="${product.quantity} <= 0" class="stock-badge-not-have">X Нет в наличии</div>
                <span class="stock-amount" th:text="'Осталось ' + ${product.quantity} + ' шт.'"></span>
            </div>

            <div class="desc-section">
                <h4>Описание</h4>
                <p th:text="${product.description}"></p>
            </div>

            <div class="add-to-purchase">
                <h4>Добавить в покупку</h4>
                
                <form id="addToPurchaseForm" th:data-product-id="${product.id}">
                    <div class="purchase-row">
                        <div class="purchase-field">
                            <label>Выберите покупку</label>
                            <select class="purchase-select" name="purchase_id">
                                <option th:each="id, iter : ${purchasesIds}" th:value="${id}" th:text="'Покупка №' + ${iter.count}"></option>
                            </select>
                        </div>
                        
                        <div class="quantity-field">
                            <label>Количество</label>
                            <input type="number" class="quantity-input" name="quantity" value="1" min="1" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-add-to-purchase">Добавить в выбранную покупку</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="toast-message"></div>
</body>
</html>
