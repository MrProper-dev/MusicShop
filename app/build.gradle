plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework:spring-webmvc:6.0.21'
    implementation 'org.springframework:spring-orm:6.0.21'
    implementation 'org.hibernate.orm:hibernate-core:6.5.1.Final'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.18'
    implementation 'com.zaxxer:HikariCP:6.0.0'
    implementation 'org.postgresql:postgresql:42.7.8'
    implementation 'org.springframework.data:spring-data-jpa:3.5.10'
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.3.RELEASE'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    compileOnly 'org.projectlombok:lombok:1.18.34'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'musicshop.App'
}

tasks.named('test') {
    useJUnitPlatform()
}
