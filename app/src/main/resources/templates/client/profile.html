<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Профиль клиента</title>
    <link rel="stylesheet" href="/client/css/profile.css">
    <script src="/client/js/profile.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand</div>
            </div>
            <div class="nav-menu">
                <a href="/products">Каталог</a>
                <a href="/orders">Заказы</a>
                <a href="/profile" class="active-nav">Профиль</a>
                <a href="/basket">Корзина</a>
            </div>
        </div>
    </div>

    <div class="profile-content">
        <div class="profile-header">
            <h1 class="profile-title">Профиль пользователя</h1>
            <a href="/logout" class="logout-btn">Выйти из аккаунта</a>
        </div>

        <form class="profile-form">
            <div class="form-row">
                <div class="form-group">
                    <label>ФИО</label>
                    <input type="text" name="fullName" th:value="${profile.fullName}" placeholder="Введите ФИО">
                </div>
                <div class="form-group">
                    <label>Номер телефона</label>
                    <input type="tel" name="phone" th:value="${profile.phone}" placeholder="+7 (___) ___-__-__">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Новый пароль</label>
                    <input type="password" name="newPassword" placeholder="Введите новый пароль">
                </div>
                <div class="form-group">
                    <label>Повторите пароль</label>
                    <input type="password" name="confirmPassword" placeholder="Повторите пароль">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel">Отмена</button>
                <button type="submit" class="btn-save">Сохранить изменения</button>
            </div>
        </form>
    </div>
</div>

<div class="toast-message"></div>
</body>
</html>
