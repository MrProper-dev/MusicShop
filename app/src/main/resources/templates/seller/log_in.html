<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Вход (Продавец)</title>
    <link rel="stylesheet" href="/seller/css/log_in.css">
    <script src="/seller/js/log_in.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="brand">
            <div class="logo-emojy">🎸</div>
            <div class="store-title">MuseLand<span class="role-badge">Продавец</span></div>
        </div>
    </div>

    <div class="login-content">
        <h1 class="page-title">Вход в аккаунт</h1>
        <p class="page-subtitle">Введите логин и пароль</p>

        <form class="login-form">
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" placeholder="ivanivanov" value="seller1">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" value="seller123">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-login">Войти</button>
            </div>
        </form>
    </div>
</div>

<div class="toast-message"></div>
</body>
</html>
