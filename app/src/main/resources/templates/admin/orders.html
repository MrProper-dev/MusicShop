<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Заказы (Администратор)</title>
    <link rel="stylesheet" href="/admin/css/orders.css">
    <script src="/admin/js/orders.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Администратор</span></div>
            </div>
            <div class="nav-menu">
                <a href="/admin/products">Каталог</a>
                <a href="/admin/sellers">Продавцы</a>
                <a href="/admin/clients">Клиенты</a>
                <a href="/admin/orders" class="active-nav">Заказы</a>
                <a href="/admin/purchases">Покупки</a>
                <a href="/admin/deliveries">Поставки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="orders-content">
        <h1 class="page-title">Заказы</h1>

        <div class="orders-filters">
            <div class="filters-group">
                <a href="/admin/orders?status=ALL" th:class="'filter-chip ' + ${currentStatus == 'ALL' ? 'active' : ''}">Все</a>
                <a href="/admin/orders?status=CREATED" th:class="'filter-chip ' + ${currentStatus == 'CREATED' ? 'active' : ''}">Создан</a>
                <a href="/admin/orders?status=READY" th:class="'filter-chip ' + ${currentStatus == 'READY' ? 'active' : ''}">Готов</a>
                <a href="/admin/orders?status=ISSUED" th:class="'filter-chip ' + ${currentStatus == 'ISSUED' ? 'active' : ''}">Выдан</a>
                <a href="/admin/orders?status=CANCELED" th:class="'filter-chip ' + ${currentStatus == 'CANCELED' ? 'active' : ''}">Отменен</a>
            </div>
            <div class="date-range-group">
                <div class="date-field">
                    <label>От:</label>
                    <input name="from" type="date">
                </div>
                <div class="date-field">
                    <label>До:</label>
                    <input name="to" type="date">
                </div>
            </div>
        </div>

        <div class="orders-list">

            <div class="order-card" th:each="order : ${orders}" th:data-order-id="${order.id}">
                <div class="order-header">
                    <div class="order-number" th:text="'Заказ № ' + ${order.id}"></div>
                    <div class="order-date" th:text="${#temporals.format(order.timestamp, 'dd MMMM yyyy, HH:mm')}"></div>
                    <div 
                        th:class="'order-status ' + ${order.status == 'CREATED' ? 'status-created' :
                            order.status == 'READY' ? 'status-ready' :
                            order.status == 'ISSUED' ? 'status-issued' : 'status-cancelled'}"
                        th:text="${order.status == 'CREATED' ? 'Создан' :
                            order.status == 'READY' ? 'Готов' :
                            order.status == 'ISSUED' ? 'Выдан' : 'Отменен'}"></div>
                </div>
                <div class="order-info">
                    <div class="order-client">
                        Клиент: <span class="client-name" th:text="${order.clientName}"></span><br>
                        Телефон: <span th:text="${order.clientPhone}"></span>
                    </div>
                    <div class="order-total" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></div>
                    <div class="order-actions">
                        <button th:if="${order.status == 'READY' || order.status == 'CREATED'}" class="btn-cancel">Отменить заказ</button>
                        <button th:unless="${order.status == 'READY' || order.status == 'CREATED'}" class="btn-cancel-disabled" disabled>Отменить заказ</button>
                    </div>
                </div>
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Количество</th>
                            <th>Цена</th>
                            <th>Сумма</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${order.products}">
                            <td><a th:href="'/admin/orders/' + ${product.productId}" class="product-link" th:text="${product.productName}"></a></td>
                            <td th:text="${product.quantity + ' шт.'}"></td>
                            <td th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></td>
                            <td th:text="${#numbers.formatDecimal(product.subtotal, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></td>
                    </tbody>
                </table>
            </div>

        </div>

        <div class="pagination-wrapper">
            <div class="pagination-list">
                <a th:if="${firstPage}" class="page-btn" th:text="${firstPage}"></a>
                <span th:if="${firstPage}" class="page-btn page-dots">⋯</span>
                <a th:each="page : ${pagesBefore}" class="page-btn" th:text="${page}"></a>
                <a class="page-btn active-page" th:text="${currentPage}"></a>
                <a th:each="page : ${pagesAfter}" class="page-btn" th:text="${page}"></a>
                <span th:if="${lastPage}" class="page-btn page-dots">⋯</span>
                <a th:if="${lastPage}" class="page-btn" th:text="${lastPage}"></a>
            </div>
        </div>
    </div>
</div>

<dialog id="modal" class="modal-dialog">
    <div class="modal-content">
        <div class="modal-body">
            <p id="modalText"></p>
            <input type="text" id="modalInput" class="modal-input">
        </div>
        <div class="modal-buttons">
            <button id="modalCancel" class="modal-button">Назад</button>
            <button id="modalOk" class="modal-button">Верно</button>
        </div>
    </div>
</dialog>

<div class="toast-message"></div>
</body>
</html>
