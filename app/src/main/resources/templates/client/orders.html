<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | История заказов</title>
    <link rel="stylesheet" href="/client/css/orders.css">
    <script src="/client/js/orders.js" defer></script>
</head>
<body>
<div class="app-container">
    
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand</div>
            </div>
            <div class="nav-menu">
                <a href="/products">Каталог</a>
                <a href="/orders" class="active-nav">Заказы</a>
                <a href="/profile">Профиль</a>
                <a href="/basket">Корзина</a>
            </div>
        </div>
    </div>

    
    <div class="orders-content">
        <h1 class="page-title">Мои заказы</h1>

        
        <div class="orders-filters">
            <a href="/orders?status=ALL" th:class="'filter-chip' + (${currentStatus == 'ALL'} ? ' active' : '')">Все</a>
            <a href="/orders?status=CREATED" th:class="'filter-chip' + (${currentStatus == 'CREATED'} ? ' active' : '')">Создан</a>
            <a href="/orders?status=READY" th:class="'filter-chip' + (${currentStatus == 'READY'} ? ' active' : '')">Готов</a>
            <a href="/orders?status=ISSUED" th:class="'filter-chip' + (${currentStatus == 'ISSUED'} ? ' active' : '')">Выдан</a>
            <a href="/orders?status=CANCELED" th:class="'filter-chip' + (${currentStatus == 'CANCELED'} ? ' active' : '')">Отменен</a>
        </div>

        
        <div class="orders-list">

            <div class="order-card" th:each="order : ${orders}">
                <div class="order-header">
                    <div class="order-number" th:text="'Заказ № ' + ${order.id}"></div>
                    <div class="order-date" th:text="${#temporals.format(order.timestamp, 'dd MMMM yyyy, HH:mm')}"></div>
                    <div class="order-status" 
                         th:class="'order-status ' + 
                                  ${order.status == 'CREATED' ? 'status-created' :
                                   order.status == 'READY' ? 'status-ready' :
                                   order.status == 'ISSUED' ? 'status-issued' : 'status-cancelled'}"
                         th:text="${order.status == 'CREATED' ? 'Создан' :
                                 order.status == 'READY' ? 'Готов' :
                                 order.status == 'ISSUED' ? 'Выдан' : 'Отменен'}"></div>
                </div>
                <div class="order-info">
                    <div class="order-items">
                        <span th:each="product, iterStat : ${order.products}">
                            <span th:text="${product.name + ' · ' + product.quantity + ' шт.'}"></span>
                            <br th:unless="${iterStat.last}" />
                        </span>
                    </div>
                    <div class="order-total" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}">117 700 ₽</div>
                    
                    <button th:if="${order.status == 'CREATED'}" class="btn-cancel" th:data-order-id="${order.id}">Отменить</button>
                    <button th:unless="${order.status == 'CREATED'}" class="btn-cancel-disabled" disabled>Отменить</button>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
