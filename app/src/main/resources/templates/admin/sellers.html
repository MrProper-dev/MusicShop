<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Управление продавцами (Администратор)</title>
    <link rel="stylesheet" href="/admin/css/sellers.css">
    <script src="/admin/js/sellers.js" defer></script>
    <style>
    </style>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Администратор</span></div>
            </div>
            <div class="nav-menu">
                <a href="/admin/products">Каталог</a>
                <a href="/admin/sellers" class="active-nav">Продавцы</a>
                <a href="/admin/clients">Клиенты</a>
                <a href="/admin/orders">Заказы</a>
                <a href="/admin/purchases">Покупки</a>
                <a href="/admin/deliveries">Поставки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="sellers-content">
        <div class="page-header">
            <h1 class="page-title">Управление продавцами</h1>
        </div>

        <div class="add-form">
            <form id="create-seller">
                <h3>Добавить нового продавца</h3>
                <div class="form-grid">
                    <div class="form-field">
                        <label>ФИО</label>
                        <input type="text" placeholder="Иванов Иван Иванович" name="fullName" required>
                    </div>
                    <div class="form-field">
                        <label>Логин</label>
                        <input type="text" placeholder="seller1234" name="login" required>
                    </div>
                    <div class="form-field">
                        <label>Почта</label>
                        <input type="email" placeholder="email@example.com" name="email" required>
                    </div>
                    <div class="form-field">
                        <label>Телефон</label>
                        <input type="tel" placeholder="+7 (999) 123-45-67" name="phone" required>
                    </div>
                    <div class="form-field">
                        <label>Пароль</label>
                        <input type="password" placeholder="Введите пароль" name="password" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel-form">Очистить</button>
                    <button class="btn-submit" type="submit">Добавить продавца</button>
                </div>
            </form>
        </div>

        <table class="sellers-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ФИО</th>
                    <th>Логин</th>
                    <th>Пароль</th>
                    <th>Почта</th>
                    <th>Телефон</th>
                    <th>Последний вход</th>
                    <th></th>
                </tr>
            </thead>
            <tbody class="sellers-list">

                <tr class="seller" th:each="seller : ${sellers}" th:data-seller-id="${seller.id}">
                    <td th:text="${seller.id}"></td>
                    <td class="edit-field">
                        <input style="display: none;" th:form="'sellerForm' + ${seller.id}" type="text" class="edit-input" name="fullName" th:value="${seller.fullName}" required>
                        <div class="info-value" th:text="${seller.fullName}"></div>
                    </td>
                    <td class="edit-field">
                        <input style="display: none;" th:form="'sellerForm' + ${seller.id}" type="text" class="edit-input" name="login" th:value="${seller.login}" required>
                        <div class="info-value" th:text="${seller.login}"></div>
                    </td>
                    <td class="edit-field">
                        <input style="display: none;" th:form="'sellerForm' + ${seller.id}" type="password" class="edit-input" name="password">
                        <div class="info-value">••••••••</div>
                    </td>
                    <td class="edit-field">
                        <input style="display: none;" th:form="'sellerForm' + ${seller.id}" type="email" class="edit-input" name="email" th:value="${seller.email}" required>
                        <div class="info-value" th:text="${seller.email}"></div>
                    </td>
                    <td class="edit-field">
                        <input style="display: none;" th:form="'sellerForm' + ${seller.id}" type="tel" class="edit-input" name="phone" th:value="${seller.phone}" required>
                        <div class="info-value" th:text="${seller.phone}"></div>
                    </td>
                    <td>
                        <div class="info-value" th:text="${#temporals.format(seller.lastLogin, 'dd.MM.yyyy, HH:mm')}"></div>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-edit">Редактировать</button>
                            <form th:id="'sellerForm' + ${seller.id}" style="display: none;"></form>
                            <button style="display: none;" th:form="'sellerForm' + ${seller.id}" type="submit" class="btn-save">Сохранить</button>
                            <button style="display: none;" class="btn-cancel">Отмена</button>
                            <button class="btn-delete">Удалить</button>
                        </div>
                    </td>
                </tr>

            </tbody>
        </table>
    </div>
</div>

<dialog id="modal" class="modal-dialog">
    <div class="modal-content">
        <div class="modal-body">
            <p id="modalText"></p>
            <input type="text" id="modalInput" class="modal-input">
        </div>
        <div class="modal-buttons">
            <button id="modalCancel" class="modal-button">Назад</button>
            <button id="modalOk" class="modal-button">Верно</button>
        </div>
    </div>
</dialog>

<div class="toast-message"></div>
</body>
</html>
