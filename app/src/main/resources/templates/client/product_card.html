<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Fender Stratocaster</title>
    <link rel="stylesheet" href="/client/css/product_card.css">
    <script src="/client/js/product_card.js" defer></script>
</head>
<body>
<div class="app-container">
    
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand</div>
            </div>
            <div class="nav-menu">
                <a href="/products">Каталог</a>
                <a href="/orders">Заказы</a>
                <a href="/profile">Профиль</a>
                <a href="/basket">Корзина</a>
            </div>
        </div>
    </div>

    
    <div class="breadcrumbs">
        <a href="/products">Каталог</a> <span>/</span> 
        <a th:href="'/products?cat-id=' + ${product.category.id}" th:text="${product.category.name}"></a> <span>/</span> 
        <span style="color:#5f5b54; font-weight:500;" th:text="${product.name}"></span>
    </div>

    
    <div class="top-action-bar">
        <button onclick="history.back()" class="btn-back">← Назад</button>
    </div>

    
    <div class="product-detail">
        <div class="product-image-block">
            <div class="main-image">
                <img class="cross-img" th:src="'/pictures/' + ${mainPicture.path}" th:alt="${product.name}">
            </div>
            <div class="thumbnail-list">
                <div th:each="img : ${product.pictures}" class="thumbnail">
                    <img class="thumb-img" th:src="'/pictures/' + ${img.path}">
                </div>
            </div>
        </div>

        
        <div class="product-info-block">
            <h1 class="product-title" th:text="${product.name}"></h1>
            <div class="product-category" th:text="'📁 ' + ${product.category.name}"></div>
            <div class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></div>

            <div class="stock-status">
                <div th:if="${product.quantity} > 0" class="status-have">✓ В наличии</div>
                <div th:if="${product.quantity} <= 0" class="status-not-have">X Нет в наличии</div>
                <span th:if="${product.quantity > 0 and product.quantity < 50}" class="stock-text" th:text="'Осталось ' + ${product.quantity} + ' шт.'"></span>
            </div>

            <div class="product-description">
                <h4>Описание</h4>
                <p th:text="${product.description}"></p>
            </div>

            
            <form id="add-basket-form" th:data-product-id="${product.id}" class="cart-action-row">
                <div class="quantity-selector">
                    <button id="less" type="button" class="quantity-btn">−</button>
                    <input id="quantity" type="text" name="quantity" class="quantity-input-cart" value="1">
                    <button id="more" type="button" class="quantity-btn">+</button>
                </div>
                <button type="submit" class="btn-add-to-cart">🛒 Добавить в корзину</button>
            </form>
        </div>
    </div>
</div>

<div class="toast-message">🎸 Товар добавлен в корзину</div>
</body>
</html>
