<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Каталог товаров (Администратор)</title>
    <link rel="stylesheet" href="/admin/css/products_list.css">
    <script src="/admin/js/products_list.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Администратор</span></div>
            </div>
            <div class="nav-menu">
                <a href="/admin/products" class="active-nav">Каталог</a>
                <a href="/admin/sellers">Продавцы</a>
                <a href="/admin/clients">Клиенты</a>
                <a href="/admin/orders">Заказы</a>
                <a href="/admin/purchases">Покупки</a>
                <a href="/admin/deliveries">Поставки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="search-area">
        <div class="search-field">
            <input type="text" name="search" placeholder="Поиск по названию" form="searchForm">
        </div>
        <form id="searchForm" action="" method="get" style="margin:0;">
            <button type="submit" class="search-submit">🔍 Найти</button>
        </form>
    </div>

    <div class="catalog-layout">
        <aside class="filters-panel">
            <button class="add-product-btn">+ Добавить товар</button>
            <h3>Фильтры</h3>
            <form id="filterForm" action="#" method="get">
                <div class="filter-group">
                    <h4>
                        Категория
                        <button type="button" class="add-category-btn">+ Добавить</button>
                    </h4>
                    <div class="category-item" th:each="cat : ${categories}" th:data-cat-id="${cat.id}">
                        <label class="category-name">
                            <input type="checkbox" name="cat-id" th:value="${cat.id}" th:text="${cat.name}">
                        </label>
                        <button type="button" class="delete-category-btn">Удалить</button>
                    </div>
                </div>
                <div class="filter-group">
                    <h4>Цена (₽)</h4>
                    <div class="price-range">
                        <input type="text" name="price_from" placeholder="от">
                        <input type="text" name="price_to" placeholder="до">
                    </div>
                </div>
                <button type="submit" class="filter-submit">Применить фильтры</button>
            </form>
        </aside>

        <div class="products-area">
            <div class="grid-products">

                <div th:each="product : ${products}" class="product-tile" th:data-product-id="${product.id}">
                    <div class="image-block">
                        <img class="img-cross" th:src="'/pictures/' + ${product.picturePath}" th:alt="${product.name}">
                    </div>
                    <div class="product-details">
                        <div class="product-name" th:text="${product.name}"></div>
                        <div class="product-cost" th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 2, 'POINT')} + ' ₽'"></div>
                        <div class="product-stock-row">Остаток: <span class="stock-value" th:text="${product.quantity} + ' шт.'"></span></div>
                        <div class="admin-actions">
                            <button class="delete-product-btn">Удалить</button>
                        </div>
                        <a th:href="'/admin/products/' + ${product.id}" class="detail-link">Подробнее</a>
                    </div>
                </div>

            </div>

            <div class="pagination-wrapper">
                <div class="pagination-list">
                    <a th:if="${firstPage}" class="page-btn" th:text="${firstPage}"></a>
                    <span th:if="${firstPage}" class="page-btn page-dots">⋯</span>
                    <a th:each="page : ${pagesBefore}" class="page-btn" th:text="${page}"></a>
                    <a class="page-btn active-page" th:text="${currentPage}"></a>
                    <a th:each="page : ${pagesAfter}" class="page-btn" th:text="${page}"></a>
                    <span th:if="${lastPage}" class="page-btn page-dots">⋯</span>
                    <a th:if="${lastPage}" class="page-btn" th:text="${lastPage}"></a>
                </div>
            </div>
        </div>
    </div>
</div>

<dialog id="modal" class="modal-dialog">
    <div class="modal-content">
        <div class="modal-body">
            <p id="modalText"></p>
            <input type="text" id="modalInput" class="modal-input">
        </div>
        <div class="modal-buttons">
            <button id="modalCancel" class="modal-button">Назад</button>
            <button id="modalOk" class="modal-button">Верно</button>
        </div>
    </div>
</dialog>

<div class="toast-message"></div>
</body>
</html>
