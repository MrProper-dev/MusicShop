<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Корзина</title>
    <link rel="stylesheet" href="/client/css/basket.css">
    <script src="/client/js/basket.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand</div>
            </div>
            <div class="nav-menu">
                <a href="/products">Каталог</a>
                <a href="/orders">Заказы</a>
                <a href="/profile">Профиль</a>
                <a href="/basket" class="active-nav">Корзина</a>
            </div>
        </div>
    </div>

    <div class="cart-content">
        <h1 class="page-title">Корзина</h1>

        <table class="cart-table" th:unless="${basket == null or basket.items.isEmpty()}">
            <thead>
                <tr>
                    <th>Товар</th>
                    <th>Цена</th>
                    <th>Количество</th>
                    <th>Сумма</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>

                <tr th:each="item : ${basket.items}">
                    <td>
                        <div class="product-cell">
                            <div class="product-thumb">
                                <img class="thumb-img" th:src="${item.imagePath}" th:alt="${item.productName}">
                            </div>
                            <span class="product-name" th:text="${item.productName}"></span>
                        </div>
                    </td>
                    <td class="price" th:text="${#numbers.formatDecimal(item.price, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></td>
                    <td>
                        <div class="quantity-control" th:data-product-id="${item.productId}">
                            <button class="quantity-btn" data-action="decrement">−</button>
                            <input type="text" class="quantity-input" th:value="${item.quantity}">
                            <button class="quantity-btn" data-action="increment">+</button>
                        </div>
                    </td>
                    <td class="item-subtotal" th:data-product-id="${item.productId}" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></td>
                    <td><button class="remove-btn" th:data-product-id="${item.productId}">Удалить</button></td>
                </tr>

            </tbody>
        </table>

        <div class="cart-summary" th:unless="${basket == null or basket.items.isEmpty()}">
            <div></div>
            <div class="total-block">
                <span class="total-label">Итого:</span>
                <span class="total-price" th:text="${#numbers.formatDecimal(basket.totalPrice, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></span>
            </div>
            <button class="checkout-btn" th:data-order-id="${basket.orderId}">Оформить заказ</button>
        </div>
    </div>
</div>

<div class="toast-message"></div>
</body>
</html>
