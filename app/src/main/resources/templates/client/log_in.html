<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Вход</title>
    <link rel="stylesheet" href="/client/css/log_in.css">
    <script src="/client/js/log_in.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="brand">
            <div class="logo-emojy">🎸</div>
            <div class="store-title">MuseLand</div>
        </div>
    </div>

    <div class="login-content">
        <h1 class="page-title">Вход в аккаунт</h1>
        <p class="page-subtitle">Введите номер телефона и пароль</p>

        <form class="login-form">
            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" value="+7 (999) 123-45-67">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" value="1234">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-login">Войти</button>
            </div>
        </form>

        <div class="register-link">
            Нет аккаунта?<a href="#">Зарегистрироваться</a>
        </div>
    </div>
</div>

<div class="toast-message"></div>
</body>
</html>
