<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Покупки (Администратор)</title>
    <link rel="stylesheet" href="/admin/css/purchases.css">
    <script src="/admin/js/purchases.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Администратор</span></div>
            </div>
            <div class="nav-menu">
                <a href="/admin/products">Каталог</a>
                <a href="/admin/sellers">Продавцы</a>
                <a href="/admin/clients">Клиенты</a>
                <a href="/admin/orders">Заказы</a>
                <a href="/admin/purchases" class="active-nav">Покупки</a>
                <a href="/admin/deliveries">Поставки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="purchases-content">
        <h1 class="page-title">Покупки</h1>

        <div class="purchases-filters">
            <div class="filters-group">
                <a href="/admin/purchases?status=ALL" th:class="'filter-chip ' + ${currentStatus == 'ALL' ? 'active' : ''}">Все</a>
                <a href="/admin/purchases?status=CREATED" th:class="'filter-chip ' + ${currentStatus == 'CREATED' ? 'active' : ''}">Активна</a>
                <a href="/admin/purchases?status=ISSUED" th:class="'filter-chip ' + ${currentStatus == 'ISSUED' ? 'active' : ''}">Завершена</a>
            </div>
            <div class="date-range-group">
                <div class="date-field">
                    <label>От:</label>
                    <input name="from" type="date">
                </div>
                <div class="date-field">
                    <label>До:</label>
                    <input name="to" type="date">
                </div>
            </div>
        </div>

        <div class="purchases-list">

            <div class="purchase-card" th:each="purchase : ${purchases}">
                <div class="purchase-header">
                    <div class="purchase-number" th:text="'Покупка № ' + ${purchase.id}"></div>
                    <div class="purchase-date" th:text="${#temporals.format(purchase.timestamp, 'dd MMMM yyyy, HH:mm')}"></div>
                    <div 
                        th:class="'purchase-status ' + ${purchase.status == 'CREATED' ? 'status-active' : 'status-completed'}" 
                        th:text="${purchase.status == 'CREATED' ? 'Активна' : 'Завершена'}"></div>
                </div>
                <div class="purchase-info">
                    <div class="purchase-seller">
                        Продавец: <span class="seller-name" th:text="${purchase.sellerName}"></span>
                    </div>
                    <div class="purchase-total" th:text="${#numbers.formatDecimal(purchase.totalPrice, 0, 'WHITESPACE', 2, 'POINT')} + ' ₽'"></div>
                </div>
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Количество</th>
                            <th>Цена</th>
                            <th>Сумма</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${purchase.products}">
                            <td><a th:href="'/admin/products/' + ${product.productId}" class="product-link" th:text="${product.productName}"></a></td>
                            <td th:text="${product.quantity} + ' шт.'"></td> 
                            <td th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 2, 'POINT')} + ' ₽'"></td>
                            <td th:text="${#numbers.formatDecimal(product.subtotal, 0, 'WHITESPACE', 2, 'POINT')} + ' ₽'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

        <div class="pagination-wrapper">
            <div class="pagination-list">
                <a th:if="${firstPage}" class="page-btn" th:text="${firstPage}"></a>
                <span th:if="${firstPage}" class="page-btn page-dots">⋯</span>
                <a th:each="page : ${pagesBefore}" class="page-btn" th:text="${page}"></a>
                <a class="page-btn active-page" th:text="${currentPage}"></a>
                <a th:each="page : ${pagesAfter}" class="page-btn" th:text="${page}"></a>
                <span th:if="${lastPage}" class="page-btn page-dots">⋯</span>
                <a th:if="${lastPage}" class="page-btn" th:text="${lastPage}"></a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
