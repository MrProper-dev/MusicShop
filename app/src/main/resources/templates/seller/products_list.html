<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Каталог товаров (Продавец)</title>
    <link rel="stylesheet" href="/seller/css/products_list.css">
    <script src="/seller/js/products_list.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Продавец</span></div>
            </div>
            <div class="nav-menu">
                <a href="/seller/products" class="active-nav">Каталог</a>
                <a href="/seller/orders">Заказы</a>
                <a href="/seller/purchases">Покупки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="search-area">
        <div class="search-field">
            <input type="text" name="search" placeholder="Поиск по названию" form="searchForm">
        </div>
        <form id="searchForm" action="" method="get" style="margin:0;">
            <button type="submit" class="search-submit">🔍 Найти</button>
        </form>
    </div>

    <div class="catalog-layout">
        <aside class="filters-panel">
            <h3>Фильтры</h3>
            <form id="filterForm" action="" method="get">
                <div class="filter-group">
                    <h4>Категория</h4>
                    <label th:each="cat : ${categories}" class="filter-option"><input type="checkbox" name="cat-id" th:value="${cat.id}" th:text="${cat.name}"></label>
                </div>
                <div class="filter-group">
                    <h4>Цена (₽)</h4>
                    <div class="price-range">
                        <input type="text" name="price_from" placeholder="от">
                        <input type="text" name="price_to" placeholder="до">
                    </div>
                </div>
                <button type="submit" class="filter-submit">Применить фильтры</button>
            </form>
        </aside>

        <div class="products-area">
            <div class="grid-products">

                <div th:each="product : ${products}" class="product-tile">
                    <div class="image-block">
                        <img class="img-cross" th:src="'/pictures/' + ${product.picturePath}" th:alt="${product.name}">
                    </div>
                    <div class="product-details">
                        <div class="product-name" th:text="${product.name}"></div>
                        <div class="product-cost" th:text="${product.price} + '₽'"></div>
                        <a th:href="'/seller/products/' + ${product.id}" class="detail-link">Подробнее</a>
                    </div>
                </div>

            </div>

            <div class="pagination-wrapper">
                <div class="pagination-list">
                    <a th:if="${firstPage}" class="page-btn" th:text="${firstPage}"></a>
                    <span th:if="${firstPage}" class="page-btn page-dots">⋯</span>
                    <a th:each="page : ${pagesBefore}" class="page-btn" th:text="${page}"></a>
                    <a class="page-btn active-page" th:text="${currentPage}"></a>
                    <a th:each="page : ${pagesAfter}" class="page-btn" th:text="${page}"></a>
                    <span th:if="${lastPage}" class="page-btn page-dots">⋯</span>
                    <a th:if="${lastPage}" class="page-btn" th:text="${lastPage}"></a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
