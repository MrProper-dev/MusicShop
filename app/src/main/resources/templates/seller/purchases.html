<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Покупки (Продавец)</title>
    <link rel="stylesheet" href="/seller/css/purchases.css">
    <script src="/seller/js/purchases.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Продавец</span></div>
            </div>
            <div class="nav-menu">
                <a href="/seller/products">Каталог</a>
                <a href="/seller/orders">Заказы</a>
                <a href="/seller/purchases" class="active-nav">Покупки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="purchases-content">
        <div class="page-header">
            <h1 class="page-title">Покупки</h1>
            <button class="btn-create">+ Создать новую покупку</button>
        </div>

        <div class="purchases-list">

            <div class="purchase-card" th:each="purchase, iter : ${purchases}" th:data-purchase-id="${purchase.id}">
                <div class="purchase-header">
                    <div class="purchase-number" th:text="'Покупка № ' + ${iter.count}"></div>
                </div>
                <div class="purchase-info">
                    <div class="purchase-total" th:text="'Итого: ' + ${#numbers.formatDecimal(purchase.totalPrice, 0, 'WHITESPACE', 2, 'POINT')} + ' ₽'" th:unless="${#lists.isEmpty(purchase.products)}"></div>
                    <div class="purchase-actions">
                        <button class="btn-delete-purchase">Удалить покупку</button>
                        <button class="btn-checkout-purchase" th:unless="${#lists.isEmpty(purchase.products)}">Произвести покупку</button>
                    </div>
                </div>
                <table class="products-table" th:unless="${#lists.isEmpty(purchase.products)}">
                    <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Количество</th>
                            <th>Цена</th>
                            <th>Сумма</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="product" th:each="product : ${purchase.products}" th:data-product-id="${product.productId}">
                            <td><a th:href="'/seller/products/' + ${product.productId}" class="product-link" th:text="${product.productName}"></a></td>
                            <td>
                                <div class="quantity-control">
                                    <button class="quantity-btn less">−</button>
                                    <input type="text" class="quantity-input" th:value="${product.quantity}">
                                    <button class="quantity-btn more">+</button>
                                </div>
                            </td>
                            <td class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 2, 'POINT')} + ' ₽'"></td>
                            <td class="product-cost-cell" th:text="${#numbers.formatDecimal(product.subtotal, 0, 'WHITESPACE', 2, 'POINT')} + ' ₽'"></td>
                            <td class="action-cell"><button class="btn-delete-product">Удалить</button></td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty-products" th:if="${#lists.isEmpty(purchase.products)}">
                    Нет товаров. Добавьте товары из каталога.
                </div>
            </div>

        </div>
    </div>
</div>

<div class="toast-message"></div>
</body>
</html>
