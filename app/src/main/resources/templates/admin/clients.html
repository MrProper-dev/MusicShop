<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Клиентская база (Администратор)</title>
    <link rel="stylesheet" href="/admin/css/clients.css">
    <script src="/admin/js/clients.js" defer></script>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Администратор</span></div>
            </div>
            <div class="nav-menu">
                <a href="/admin/products">Каталог</a>
                <a href="/admin/sellers">Продавцы</a>
                <a href="/admin/clients" class="active-nav">Клиенты</a>
                <a href="/admin/orders">Заказы</a>
                <a href="/admin/purchases">Покупки</a>
                <a href="/admin/deliveries">Поставки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="clients-content">
        <div class="page-header">
            <h1 class="page-title">Клиентская база</h1>
        </div>

        <div class="search-area">
            <form id="search-form" action="" method="get" style="display: none;"></form>
            <div class="search-field">
                <input form="search-form" type="text" name="search" placeholder="Поиск по ФИО или телефону..." th:value="${search}">
            </div>
            <button form="search-form" type="submit" class="search-submit">🔍 Найти</button>
        </div>

        <table class="clients-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Клиент</th>
                    <th>Телефон</th>
                    <th>Количество заказов</th>
                    <th>Сумма заказов</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="client : ${clients}">
                    <td th:text="${client.id}"></td>
                    <td>
                        <div class="client-info">
                            <span class="client-name" th:text="${client.fullName}"></span>
                        </div>
                    </td>
                    <td th:text="${client.phone}"></td>
                    <td th:text="${client.orderQuantity}"></td>
                    <td th:text="${#numbers.formatDecimal(client.totalCost, 0, 'WHITESPACE', 2, 'POINT')} + ' ₽'"></td>
                    <td><a th:href="'/admin/clients/' + ${client.id}" class="btn-details">Подробнее</a></td>
                </tr>
            </tbody>
        </table>

        <div class="pagination-wrapper">
            <div class="pagination-list">
                <a th:if="${firstPage}" class="page-btn" th:text="${firstPage}"></a>
                <span th:if="${firstPage}" class="page-btn page-dots">⋯</span>
                <a th:each="page : ${pagesBefore}" class="page-btn" th:text="${page}"></a>
                <a class="page-btn active-page" th:text="${currentPage}"></a>
                <a th:each="page : ${pagesAfter}" class="page-btn" th:text="${page}"></a>
                <span th:if="${lastPage}" class="page-btn page-dots">⋯</span>
                <a th:if="${lastPage}" class="page-btn" th:text="${lastPage}"></a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
