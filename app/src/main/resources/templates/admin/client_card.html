<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore | Карточка клиента (Администратор)</title>
    <link rel="stylesheet" href="/admin/css/client_card.css">
    <script src="/admin/js/client_card.js" defer></script>
    <style>
    </style>
</head>
<body>
<div class="app-container">
    <div class="main-header">
        <div class="header-row">
            <div class="brand">
                <div class="logo-emojy">🎸</div>
                <div class="store-title">MuseLand<span class="role-badge">Администратор</span></div>
            </div>
            <div class="nav-menu">
                <a href="/admin/products">Каталог</a>
                <a href="/admin/sellers">Продавцы</a>
                <a href="/admin/clients">Клиенты</a>
                <a href="/admin/orders">Заказы</a>
                <a href="/admin/purchases">Покупки</a>
                <a href="/admin/deliveries">Поставки</a>
                <a href="/logout">Выйти</a>
            </div>
        </div>
    </div>

    <div class="breadcrumb-block">
        <a href="#">Клиентская база</a> <span>/</span> 
        <span style="color:#5f5b54; font-weight:500;">Карточка клиента</span>
    </div>

    <div class="action-top">
        <a class="btn-back-link" onclick="history.back()">← Назад</a>
    </div>

    <div class="client-card-content">
        <div class="client-info-block">
            <div class="client-info-title">Информация о клиенте</div>
            <div class="info-row">
                <div class="info-item">
                    <div class="info-label">ФИО</div>
                    <div class="info-value" th:text="${client.name}"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Номер телефона</div>
                    <div class="info-value" th:text="${client.phone}"></div>
                </div>
            </div>
        </div>

        <div class="orders-header">
            <div class="orders-history-title">История заказов</div>
            <div class="orders-summary">
                Всего заказов: <span th:text="${client.ordersQuantity}"></span> | Общая сумма: <span th:if="${client.totalOrdersCost > 0}" th:text="${#numbers.formatDecimal(client.totalOrdersCost, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></span> <span th:if="${client.totalOrdersCost <= 0}">0 ₽</span>
            </div>
        </div>
        
        <div class="orders-list">

            <div class="order-card" th:each="order : ${client.orders}" th:data-order-id="${order.id}">
                <div class="order-header">
                    <div class="order-number" th:text="'Заказ № ' + ${order.id}"></div>
                    <div class="order-date" th:text="${#temporals.format(order.timestamp, 'dd MMMM yyyy, HH:mm')}"></div>
                    <div 
                        th:class="'order-status ' + ${order.status == 'CREATED' ? 'status-created' :
                            order.status == 'READY' ? 'status-ready' :
                            order.status == 'ISSUED' ? 'status-issued' : 'status-cancelled'}"
                        th:text="${order.status == 'CREATED' ? 'Создан' :
                            order.status == 'READY' ? 'Готов' :
                            order.status == 'ISSUED' ? 'Выдан' : 'Отменен'}"></div>
                </div>
                <div class="order-info">
                    <div class="order-seller">
                        Продавец: <span class="seller-name" th:text="${order.sellerName}"></span>
                    </div>
                    <div class="order-total" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></div>
                </div>
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Количество</th>
                            <th>Цена</th>
                            <th>Сумма</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${order.products}">
                            <td><a th:href="'/admin/products/' + ${product.id}" class="product-link" th:text="${product.name}"></a></td>
                            <td th:text="${product.quantity + ' шт.'}"></td>
                            <td th:text="${#numbers.formatDecimal(product.price, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></td>
                            <td th:text="${#numbers.formatDecimal(product.subtotal, 0, 'WHITESPACE', 2, 'POINT') + ' ₽'}"></td>
                        </tr>
                    </tbody>
                </table>
                <div class="order-actions">
                    <button th:if="${order.status == 'READY' || order.status == 'CREATED'}" class="btn-cancel">Отменить заказ</button>
                    <button th:unless="${order.status == 'READY' || order.status == 'CREATED'}" class="btn-cancel-disabled" disabled>Отменить заказ</button>
                </div>
            </div>

        </div>
    </div>
</div>

<dialog id="modal" class="modal-dialog">
    <div class="modal-content">
        <div class="modal-body">
            <p id="modalText"></p>
            <input type="text" id="modalInput" class="modal-input">
        </div>
        <div class="modal-buttons">
            <button id="modalCancel" class="modal-button">Назад</button>
            <button id="modalOk" class="modal-button">Верно</button>
        </div>
    </div>
</dialog>

<div class="toast-message"></div>
</body>
</html>
